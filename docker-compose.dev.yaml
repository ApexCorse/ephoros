name: ephoros-server-dev

services:
  simulator:
    build:
      dockerfile: Dockerfile
      context: .
      args:
        SERVICE: simulator
    environment:
      - DBC_FILE_PATH=/opt/config.dbc
    networks:
      - default
    env_file:
      - path: .env.example
      - path: .env
        required: false
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ./:/opt

networks:
  default:
    driver: bridge
