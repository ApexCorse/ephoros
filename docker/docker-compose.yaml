name: ephoros-server

services:
  config:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        SERVICE: config
    volumes:
      - ../:/opt
    environment:
      - DBC_FILE_PATH=/opt/config.dbc
      - DASHBOARDS_PATH=/opt/grafana/provisioning/dashboards/
  broker:
    image: emqx/emqx-enterprise:5.10.0
    hostname: docker.emqx.com
    networks:
      default:
        aliases:
          - broker
    environment:
      - "EMQX_NODE_NAME=emqx@docker.emqx.com"
      - "EMQX_CLUSTER__DISCOVERY_STRATEGY=static"
      - "EMQX_CLUSTER__STATIC__SEEDS=[emqx@docker.emqx.com]"
      - "EMQX_HOST=docker.emqx.com"
    ports:
      - 18083:18083
      - 1883:1883
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
  client:
    image: grafana/grafana
    environment:
      - GF_PLUGINS_PREINSTALL=grafana-mqtt-datasource
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s
    env_file: ../.env
    networks:
      - default
    ports:
      - 3000:3000
    depends_on:
      broker:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning
      - ../grafana/provisioning/dashboards:/var/lib/grafana/dashboards

networks:
  default:
    driver: bridge
