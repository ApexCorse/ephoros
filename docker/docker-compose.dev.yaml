name: ephoros-server-dev

services:
  simulator:
    build:
      dockerfile: docker/Dockerfile
      context: ..
      args:
        SERVICE: simulator
    environment:
      - DBC_FILE_PATH=/opt/config.dbc
    networks:
      - default
    env_file: ../.env
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ../:/opt

networks:
  default:
    driver: bridge
